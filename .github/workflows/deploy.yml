name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-workers-api:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://salessync-api.reshigan-085.workers.dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Apply D1 migrations
        working-directory: workers-api
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: npx wrangler d1 migrations apply salessync-db --remote

      - name: Deploy Workers API
        working-directory: workers-api
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: npx wrangler deploy --name salessync-api

      - name: Smoke test API
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://salessync-api.reshigan-085.workers.dev/api/auth/login -H "Content-Type: application/json" -d '{}')
          echo "API status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "API deployment may have failed - endpoint unreachable"
            exit 1
          fi
          echo "Workers API deployed and reachable"

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ss.vantax.co.za
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Build frontend
        working-directory: frontend-vite
        env:
          VITE_GIT_COMMIT: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: frontend-vite
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=ssreports --branch=main --commit-dirty=true

      - name: Smoke test frontend
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://ss.vantax.co.za)
          echo "Frontend status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Frontend deployment may have failed - endpoint unreachable"
            exit 1
          fi
          echo "Frontend deployed"

  post-deploy:
    name: Post-Deployment Verification
    needs: [deploy-workers-api, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify full stack
        run: |
          echo "Verifying full stack deployment..."
          echo "Frontend: https://ss.vantax.co.za"
          echo "Workers API: https://salessync-api.reshigan-085.workers.dev"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Deployment time: $(date -u)"
